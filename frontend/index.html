<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WattWise · لوحة التحكم</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/dashboard.css?v=7">
<link rel="stylesheet" href="css/schedule.css?v=1">
<script src="vendor/chart.umd.js"></script>
</head>
<body>
<div class="app">

  <!-- The agent column: goal, plan, the request that needs the user, decision log -->
  <aside class="agent">
    <div class="a-top">
      <a class="brand" href="index.html">Watt<em>Wise</em></a>
      <button class="btn btn-danger btn-sm" type="button" data-act="estop">إيقاف طوارئ</button>
    </div>
    <div class="blk" id="goal"></div>
    <div class="blk" id="approve"></div>
    <div class="blk" id="plan"></div>
    <div class="blk blk-last" id="log"></div>
  </aside>

  <!-- The house: key numbers, floor plan with devices, savings chart, extra tools -->
  <main class="main">
    <div class="m-top">
      <nav class="tabs" id="sites" aria-label="المكان"></nav>
      <span class="m-status" id="agent-status"></span>
      <details class="menu" id="menu">
        <summary class="btn btn-quiet btn-sm">المزيد</summary>
        <div class="menu-list" id="menu-list"></div>
      </details>
    </div>

    <!-- Simulator controls: only shown when the data comes from the simulator -->
    <section class="demo" id="demo" hidden></section>

    <section class="nums" id="kpis"></section>
    <div id="anomaly"></div>

    <section id="devices"></section>

    <section class="box-line" id="savings-card">
      <div class="sec-h">
        <h2>اليوم: الفعلي مقابل المتوقع دون الوكيل <span class="hint" style="font-weight:400" id="chart-unit"></span></h2>
        <div class="key">
          <span><i class="k-line"></i>الفعلي</span>
          <span><i class="k-dash"></i>دون الوكيل</span>
          <span><i class="k-fill"></i>الموفَّر</span>
          <span class="clock n" id="meter-clock"></span>
        </div>
      </div>
      <div class="savings-grid">
        <div class="chart-wrap"><canvas id="chart" data-keep></canvas></div>
        <div id="bill"></div>
      </div>
    </section>

    <!-- Extra tools: closed by default so the page stays short -->
    <details class="box-line more" id="more-teach">
      <summary><h2>تعريف الأجهزة</h2></summary>
      <div id="teach"></div>
    </details>
    <details class="box-line more" id="more-sched">
      <summary><h2>الجداول</h2></summary>
      <div id="sched"></div>
    </details>
    <details class="box-line more" id="more-analyst">
      <summary><h2>الفاتورة والتقارير</h2></summary>
      <div id="analyst"></div>
    </details>
  </main>
</div>

<!-- Phone preview: hidden until needed (backup if the real phone fails in the demo). -->
<div class="drawer" id="phone-drawer" hidden>
  <div class="drawer-back" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="معاينة تطبيق الهاتف">
    <button class="drawer-x" type="button" data-close aria-label="إغلاق">✕</button>
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-status" dir="ltr">
          <span id="phone-clock"></span>
          <span class="notch"></span>
          <span class="wifi">Wi-Fi</span>
        </div>
        <iframe id="phone-frame" title="تطبيق صاحب البيت"></iframe>
      </div>
    </div>
    <div class="connect-card">
      <div class="connect-title">ربط تطبيق الهاتف</div>
      <img class="connect-qr" src="api/connect/qr.svg" alt="رمز QR يحمل عنوان الخادم" loading="lazy">
      <div class="connect-url" dir="ltr" id="connect-url"></div>
      <div class="aside-note">امسح الرمز من التطبيق.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/common.js?v=4"></script>
<script src="js/schedule.js?v=1"></script>
<script src="js/dashboard.js?v=8"></script>
</body>
</html>
