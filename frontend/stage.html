<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WattWise · شاشة العرض</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/stage.css?v=1">
</head>
<body>
<!-- Projector screen for the judges: goal -> plan -> approval on the judge's phone -> real action -> measured saving.
     Everything here comes from the same /state API as the dashboard. Works with no internet. -->
<div class="stage">
  <header class="bar" id="bar"></header>
  <section id="offline"></section>
  <div class="grid">
    <div class="col">
      <section class="panel" id="goal"></section>
      <section class="panel" id="plan"></section>
    </div>
    <div class="col">
      <section class="panel" id="approve"></section>
      <section class="panel" id="savings"></section>
    </div>
  </div>
  <section class="panel log" id="log"></section>
</div>
<div class="toast" id="toast"></div>
<script src="js/common.js?v=3"></script>
<script src="js/stage.js?v=1"></script>
</body>
</html>
