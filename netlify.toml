# OPTIONAL public copy of the web pages on Netlify (synthetic data only).
# The competition demo does not need it: locally, use scripts/run_demo.py.
#
# Netlify only serves the static files in frontend/. Every /api/... request is
# forwarded (proxied) to the backend on Render, so the pages work unchanged
# and no CORS settings are needed.

[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "__RENDER_URL__/api/:splat"
  status = 200
  force = true
