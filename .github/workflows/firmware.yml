# Compiles every ESP32 sketch in firmware/ so a typo is caught before the team flashes the board.
# It only compiles; it never needs a board or Wi-Fi.
name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the example config for the final sketch
        run: cp firmware/wattwise/config.example.h firmware/wattwise/config.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: ArduinoJson
            - name: PZEM-004T-v30
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: LiquidCrystal I2C
          sketch-paths: |
            - firmware
          enable-deltas-report: false
