# Builds the WattWise phone app for iPhone WITHOUT code signing and
# uploads it as an .ipa file. Download it from the Actions tab and load it
# with Sideloadly, which signs it with your own Apple ID.
name: iOS IPA (unsigned, for Sideloadly)

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server address baked into the app (leave as is for Railway)"
        required: false
        default: "https://wattwise-production-f321c49b.up.railway.app"
  push:
    branches: [main, "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-ipa.yml"

env:
  DEFAULT_SERVER: "https://wattwise-production-f321c49b.up.railway.app"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Get packages
        run: flutter pub get

      - name: Build iOS app (no signing)
        run: |
          set -o pipefail   # a failed xcodebuild must fail this step, even through "| tail"
          SERVER="${{ github.event.inputs.server }}"
          if [ -z "$SERVER" ]; then SERVER="$DEFAULT_SERVER"; fi
          echo "Server baked into the app: $SERVER"
          # 1) Flutter writes the Xcode settings (with the server address baked in).
          flutter build ios --release --no-codesign --config-only --dart-define=WATTWISE_SERVER="$SERVER"
          # 2) Xcode builds the app (and compiles the Dart code) with signing switched off for every
          #    target. Errors are printed in the last lines below.
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../build/xc \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 40
          test -f ../build/xc/Build/Products/Release-iphoneos/Runner.app/Info.plist
          test -f ../build/xc/Build/Products/Release-iphoneos/Runner.app/Frameworks/App.framework/App

      - name: Package Runner.app into an .ipa
        run: |
          rm -rf Payload WattWise.ipa
          mkdir Payload
          cp -R build/xc/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry WattWise.ipa Payload
          ls -lh WattWise.ipa
          # Check the .ipa before uploading: Sideloadly needs Payload/Runner.app/Info.plist,
          # and a real app is several MB (a broken build is only a few KB).
          unzip -l WattWise.ipa | grep -q " Payload/Runner.app/Info.plist$"
          unzip -l WattWise.ipa | grep -q " Payload/Runner.app/Frameworks/App.framework/App$"
          SIZE=$(stat -f%z WattWise.ipa)
          echo "IPA size: $SIZE bytes"
          test "$SIZE" -gt 2000000

      - uses: actions/upload-artifact@v4
        with:
          name: WattWise-ios-unsigned-ipa
          path: mobile/WattWise.ipa
          retention-days: 30
